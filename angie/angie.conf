user  angie;
worker_processes  auto;

error_log  /var/log/angie/error.log notice;
pid        /run/angie/angie.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/angie/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/angie/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Настройка проксирования на FastAPI
    server {
        listen 80;
        server_name localhost;

        # Увеличиваем максимальный размер тела запроса, если через прокси будут гонять тяжелые JSON/файлы
        client_max_body_size 20M;

        location / {
            # "web-app" — это имя сервиса из docker-compose.yml
            proxy_pass http://web-app:8000;

            # Передача оригинальных заголовков клиента (необходимо для прокси-сервисов)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Отключаем буферизацию для ускорения стриминга ответов (актуально для прокси)
            proxy_buffering off;
        }
    }
}
